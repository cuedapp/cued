# Minimal Cued installation (without STRM output).
# Save as compose.yaml, create a .env file beside it, then run:
#   docker compose up -d --wait
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cued
      POSTGRES_USER: cued
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cued-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cued -d cued"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cued:
    # `latest` is Cued's stable release tag. Pin CUED_IMAGE to a version or digest for controlled upgrades.
    image: ${CUED_IMAGE:-ghcr.io/cuedapp/cued:latest}
    environment:
      DATABASE_URL: postgresql://cued:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cued
      CUED_ENCRYPTION_KEY: ${CUED_ENCRYPTION_KEY:?Set CUED_ENCRYPTION_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${CUED_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  cued-postgres:

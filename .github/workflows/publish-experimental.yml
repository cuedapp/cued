name: Publish experimental container

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-experimental
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cuedapp/cued

jobs:
  verify:
    name: Verify experimental build
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish experimental image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=experimental
            type=sha,format=short,prefix=experimental-
          labels: |
            org.opencontainers.image.source=https://github.com/cuedapp/cued
            org.opencontainers.image.url=https://github.com/cuedapp/cued
            org.opencontainers.image.version=experimental-${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=experimental-${{ github.sha }}
